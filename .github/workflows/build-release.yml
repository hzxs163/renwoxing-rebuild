name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v378-modern.1'
        required: true
        default: 'v378-modern.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build-tools
        run: |
          curl -sSLo build-tools.zip https://dl.google.com/android/repository/build-tools_r34-linux.zip
          unzip -q build-tools.zip -d build-tools
          chmod +x build-tools/*/zipalign
          echo "BUILD_TOOLS=$(echo "$PWD"/build-tools/android-*)" >> "$GITHUB_ENV"

      - name: Repack and sign
        run: |
          python3 tools/build.py \
            --input original/renwoxing-378-original.apk \
            --output dist/renwoxing-378-modern.apk \
            --build-tools "$BUILD_TOOLS" \
            --keystore signing/rebuild-key.p12 \
            --ks-pass renwoxing2026 \
            --key-alias renwoxing \
            --key-pass renwoxing2026 \
            --target-sdk 24

      - uses: actions/upload-artifact@v4
        with:
          name: renwoxing-378-modern
          path: dist/renwoxing-378-modern.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          任我行 (com.qyqd) 378 重新打包版。

          - 唯一改动：编译后的 `android:targetSdkVersion` 由 22 改为 24（Android 15/16 拒绝安装 targetSdk < 24 的应用）。
          - 其余 831 个文件与原包逐字节一致；未改动任何代码或资源。
          - 重新签名（v1 + v2 + v3），证书与官方/原包不同。

          **安装前请先卸载旧版本**（签名不同，无法覆盖安装）。

          **仅含 armeabi-v7a 32 位库**：纯 64 位机型（Pixel 7 及更新、部分旗舰）仍然无法安装。
          EOF
          gh release create "$TAG" dist/renwoxing-378-modern.apk \
            --title "任我行 378 现代版 ($TAG)" \
            --notes-file notes.md
